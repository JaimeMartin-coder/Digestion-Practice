<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>One Bite: A Trip Through the Digestive System</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Lexend:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{
  --wall:#EEF2F4; --paper:#FFFFFF; --ink:#1B2330; --muted:#566273;
  --gut:#7A2E5A; --gut-soft:#F3E6EE; --helper:#2C7A80; --helper-soft:#E1F0F1;
  --bite:#E3A21A; --line:#CED6DC; --good:#1E7A3C; --bad:#B0281F;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--wall);color:var(--ink);
  font-family:Lexend,Verdana,Arial,sans-serif;font-size:17px;line-height:1.6}
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
h1,h2,h3{font-family:"Bricolage Grotesque","Trebuchet MS",Arial,sans-serif;line-height:1.15;margin:0 0 .4em}
h1{font-size:2.3rem;font-weight:800;letter-spacing:-.01em}
h2{font-size:1.7rem;font-weight:800}
h3{font-size:1.1rem;font-weight:600}
p{margin:0 0 .8em}
button{font:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--bite);outline-offset:2px}
.app{display:grid;grid-template-columns:250px 1fr;gap:28px;max-width:1180px;margin:0 auto;padding:22px}
@media(max-width:820px){.app{grid-template-columns:1fr;padding:12px;gap:12px}}

/* ---------- route map ---------- */
.map{position:sticky;top:16px;align-self:start;background:var(--paper);border-radius:14px;padding:16px 6px 14px;border:1px solid var(--line)}
.map h3{font-size:.95rem;color:var(--muted);margin:0 0 6px 8px;font-weight:600}
.map svg{width:100%;height:auto;display:block}
.map .legend{font-size:.78rem;color:var(--muted);margin:8px 8px 0;line-height:1.4}
.legend span{display:inline-block;width:18px;height:4px;border-radius:2px;vertical-align:middle;margin-right:5px}
@media(max-width:820px){.map{position:static}.map svg{max-height:210px}}

/* ---------- main card ---------- */
.card{background:var(--paper);border-radius:16px;border:1px solid var(--line);padding:28px 32px;min-height:520px}
@media(max-width:820px){.card{padding:18px}}
.screen{display:none}.screen.on{display:block}
.stopTag{display:inline-block;font-size:.85rem;font-weight:600;padding:3px 10px;border-radius:20px;margin-bottom:10px}
.tag-main{background:var(--gut-soft);color:var(--gut)}
.tag-helper{background:var(--helper-soft);color:var(--helper)}
.twocol{display:grid;grid-template-columns:1fr 300px;gap:24px;align-items:start}
@media(max-width:980px){.twocol{grid-template-columns:1fr}}
.organ{background:var(--wall);border-radius:12px;padding:10px;text-align:center}
.organ svg{width:100%;max-width:300px;height:auto}
.organ figcaption{font-size:.8rem;color:var(--muted)}
.read p{max-width:62ch}
.tools{display:flex;gap:8px;flex-wrap:wrap;margin:4px 0 14px}
.chip{border:1.5px solid var(--line);background:var(--paper);border-radius:22px;padding:5px 14px;font-size:.9rem}
.chip:hover{border-color:var(--ink)}
.chip[aria-pressed="true"]{background:var(--ink);color:#fff;border-color:var(--ink)}
.words{display:none;background:#FFF8E6;border-left:4px solid var(--bite);border-radius:6px;padding:10px 14px;margin:0 0 14px;font-size:.93rem}
.words.on,.deep.on{display:block}
.words dt{font-weight:600;display:inline}
.words dd{display:inline;margin:0}
.words div{margin:2px 0}
.deep{display:none;background:var(--helper-soft);border-radius:8px;padding:10px 14px;margin:0 0 14px;font-size:.93rem}

/* bite tracker */
.tracker{border:1.5px dashed var(--line);border-radius:12px;padding:10px 14px;margin:14px 0 18px}
.tracker h3{font-size:.95rem;margin-bottom:4px}
.trow{display:grid;grid-template-columns:150px 1fr 200px;align-items:center;gap:10px;font-size:.88rem;min-height:34px}
@media(max-width:560px){.trow{grid-template-columns:1fr;gap:0;margin-bottom:6px}}
.trow svg{height:26px;width:100%;max-width:230px}
.trow .st{color:var(--muted);font-size:.82rem}
.trow.changed .st{color:var(--gut);font-weight:600}

/* questions */
.q{border-top:1px solid var(--line);padding-top:16px;margin-top:6px}
.q + .q{margin-top:16px}
.q .prompt{font-weight:600;margin-bottom:8px}
.opts{display:grid;gap:8px}
.opts.pills{grid-template-columns:repeat(auto-fit,minmax(130px,1fr))}
.opt{text-align:left;border:2px solid var(--line);background:var(--paper);border-radius:10px;padding:9px 14px}
.opt:hover:not(:disabled){border-color:var(--ink)}
.opt.right{border-color:var(--good);background:#E6F4EA}
.opt.wrong{border-color:var(--bad);background:#FBEAE8;text-decoration:line-through}
.opt:disabled{cursor:default;color:var(--ink)}
.fb{margin-top:8px;font-size:.95rem;min-height:1.2em}
.fb.good{color:var(--good)}.fb.bad{color:var(--bad)}
.hintBtn{background:none;border:none;color:var(--helper);text-decoration:underline;padding:0;font-size:.9rem;margin-top:6px}
.hint{display:none;font-size:.9rem;color:var(--muted);margin-top:4px}.hint.on{display:block}

.nav{display:flex;justify-content:space-between;align-items:center;margin-top:24px;gap:10px;flex-wrap:wrap}
.go{background:var(--gut);color:#fff;border:none;border-radius:10px;padding:11px 22px;font-weight:600}
.go:disabled{background:#B9A7B1;cursor:not-allowed}
.back{background:none;border:1.5px solid var(--line);border-radius:10px;padding:10px 16px}
.lock{font-size:.85rem;color:var(--muted)}

/* forms */
label.f{display:block;font-weight:600;margin:12px 0 4px}
input[type=text],select,textarea{font:inherit;width:100%;max-width:420px;padding:9px 12px;border:1.5px solid var(--line);border-radius:8px;background:#fff}
textarea{max-width:100%;min-height:110px}
.orderList{list-style:none;padding:0;margin:8px 0;max-width:420px}
.orderList li{display:flex;align-items:center;gap:8px;border:1.5px solid var(--line);border-radius:8px;padding:6px 10px;margin-bottom:6px;background:#fff}
.orderList li b{width:1.4em;color:var(--gut)}
.orderList li span{flex:1}
.orderList button{border:1px solid var(--line);background:var(--wall);border-radius:6px;width:34px;height:32px}
.checks{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:6px;max-width:600px}
.checks label{border:1.5px solid var(--line);border-radius:8px;padding:6px 10px;display:flex;gap:8px;align-items:center;background:#fff}
.case{background:var(--wall);border-radius:12px;padding:14px 18px;margin:10px 0 14px}
.case ul{margin:6px 0 0;padding-left:20px}
.frame{font-size:.9rem;color:var(--muted);background:#FFF8E6;border-radius:6px;padding:8px 12px;margin:6px 0}

/* log */
.logWrap{margin-top:20px}
.logWrap summary{cursor:pointer;font-weight:600;color:var(--helper)}
table.log{border-collapse:collapse;width:100%;font-size:.86rem;margin-top:8px}
table.log th,table.log td{border:1px solid var(--line);padding:5px 8px;text-align:left;vertical-align:top}
table.log th{background:var(--wall)}
.tableScroll{overflow-x:auto}

/* end */
.code{font-family:"Bricolage Grotesque",Arial,sans-serif;font-size:2.4rem;font-weight:800;letter-spacing:.06em;color:var(--gut);background:var(--gut-soft);display:inline-block;padding:6px 20px;border-radius:12px;margin:6px 0 12px}
.score{font-size:1.15rem}
.save{margin:10px 0;font-weight:600}
.compare{margin:12px 0}
.compare li{margin-bottom:4px}
.hero{display:grid;grid-template-columns:1fr 200px;gap:20px;align-items:center}
@media(max-width:700px){.hero{grid-template-columns:1fr}.hero svg{max-width:160px}}
.small{font-size:.85rem;color:var(--muted)}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
.token{transition:cy .7s ease, cx .7s ease}
</style>
</head>
<body>

    <h3>Route map</h3>
    <svg id="routeMap" viewBox="0 0 262 470" role="img" aria-labelledby="mapTitle">
      <title id="mapTitle">The main line runs mouth, esophagus, stomach, small intestine, large intestine, exit. Liver, gallbladder, and pancreas are feeder lines that send juices into the small intestine.</title>

    <p class="legend"><span style="background:var(--gut)"></span>Main line: food rides here<br><span style="background:var(--helper)"></span>Feeder line: only juices travel</p>
  </aside>

  <main class="card" id="card" aria-live="polite"></main>
</div>

function drawMap(active){

  s += `<path d="M170 305 L170 282 Q170 266 152 265 L124 262" fill="none" stroke="#2C7A80" stroke-width="4" stroke-dasharray="7 5"/>`;
  for (const k in P){

  let tokenAt = 'mouth';

    const st = STOPS[idx];

  m.innerHTML = s;
}

const STATE_TXT = {whole:'whole', partial:'partly broken', small:'broken into small molecules', absorbed:'absorbed into blood', emulsified:'tiny droplets (emulsified)'};
function beads(state, isFat){
  const y=13; let s='';
  if (state==='absorbed'){
    for(let i=0;i<6;i++) s+=`<circle cx="${14+i*20}" cy="${y}" r="6" fill="none" stroke="#9AA5B1" stroke-dasharray="2 2"/>`;
    return s;
  }
  if (isFat && state==='whole') return `<ellipse cx="62" cy="${y}" rx="52" ry="11" fill="#FFF1CC" stroke="#1B2330" stroke-width="2"/>`;
  if (isFat && state==='emulsified'){ for(let i=0;i<8;i++) s+=`<circle cx="${12+i*15}" cy="${y+(i%2?4:-4)}" r="5" fill="#FFF1CC" stroke="#1B2330" stroke-width="1.5"/>`; return s; }
  const gaps = state==='whole'?[]: state==='partial'?[2]:[0,1,2,3,4];
  let x=10;
  for(let i=0;i<6;i++){
    s+=`<circle cx="${x}" cy="${y}" r="7" fill="${isFat?'#FFF1CC':'#fff'}" stroke="#1B2330" stroke-width="2"/>`;
    if(i<5){
      if(gaps.includes(i)){ x+=26; }
      else { s+=`<line x1="${x+7}" y1="${y}" x2="${x+13}" y2="${y}" stroke="#1B2330" stroke-width="2.5"/>`; x+=20; }
    }
  }
  return s;
}
function tracker(stop, prev){
  const rows=[['S','Starch (crust)'],['P','Protein (cheese)'],['F','Fat (cheese + pepperoni)']];
  let h=`<div class="tracker" aria-label="Bite tracker"><h3>What is left of the bite</h3>`;
  rows.forEach(([k,lab])=>{
    const st=stop.bite[k], changed = prev && prev[k]!==st;
    h+=`<div class="trow ${changed?'changed':''}"><span>${lab}</span><svg viewBox="0 0 140 26" aria-hidden="true">${beads(st,k==='F')}</svg><span class="st">${changed?'changed: ':''}${STATE_TXT[st]}</span></div>`;
  });
  return h+`</div>`;
}

function mcqHTML(key, item, pills){
  const order = shuffle(item.o.map((_,i)=>i), key);
  let h=`<div class="q" data-key="${key}"><div class="prompt">${item.q}</div><div class="opts ${pills?'pills':''}">`;
  order.forEach(i=>{ h+=`<button class="opt" data-i="${i}">${item.o[i][0]}</button>`; });
  h+=`</div><div class="fb" role="status"></div>`;
  if(item.hint) h+=`<button class="hintBtn" type="button">Show a hint</button><div class="hint">${item.hint}</div>`;
  return h+`</div>`;
}
function wireMCQ(root, key, item, bucket, onSolved){
  const q = root.querySelector(`.q[data-key="${key}"]`);
  const fb = q.querySelector('.fb');
  const hb = q.querySelector('.hintBtn');
  if(hb) hb.onclick=()=>{q.querySelector('.hint').classList.add('on');hb.remove();};
  if((bucket==='gf'?S.gf:S.solved)[key+'_done']){ // restore solved view
    q.querySelectorAll('.opt').forEach(b=>{ if(item.o[b.dataset.i][1]) b.classList.add('right'); b.disabled=true; });
    fb.className='fb good'; fb.textContent='Solved.'; return;
  }
  q.querySelectorAll('.opt').forEach(b=>{
    b.onclick=()=>{
      const [txt,ok,msg]=item.o[b.dataset.i];
      const store = bucket==='gf'?S.gf:S.first;
      if(!(key in store)) store[key]=!!ok;
      fb.textContent=msg;
      if(ok){
        b.classList.add('right'); fb.className='fb good';
        q.querySelectorAll('.opt').forEach(x=>x.disabled=true);
        (bucket==='gf'?S.gf:S.solved)[key+'_done']=true; q.querySelector('.hintBtn')?.remove(); q.querySelector('.hint')?.classList.remove('on');
        onSolved&&onSolved();
      } else { b.classList.add('wrong'); b.disabled=true; fb.className='fb bad'; }
    };
  });
}

  return {q:'What kind of digestion happens here?', hint:'Mechanical = smaller pieces. Chemical = smaller molecules. Neither = no breaking down.',

function travelItem(stop){
  return {q:`Does the bite of food travel through the ${stop.name.toLowerCase()}?`,
    o:[['Yes',0,'Look at the route map. The bite is parked on the main line. Only juices travel on the feeder line.'],
       ['No, it only sends juices to the small intestine',1,`Right. The ${stop.name.toLowerCase()} is an accessory organ. Food never passes through it.`]]};
}
function shuffle(arr, seedStr){
  let seed=0; for(const c of (seedStr+S.seed)) seed=(seed*31+c.charCodeAt(0))>>>0;
  const a=arr.slice();
  for(let i=a.length-1;i>0;i--){ seed=(seed*1103515245+12345)>>>0; const j=seed%(i+1); [a[i],a[j]]=[a[j],a[i]]; }
  return a;
}

  const i=S.screen-2;
  if(i>=0 && i<STOPS.length) return STOPS[i].map;
  if(S.screen>=screenIdx('case')) return 'exit';
  return null;
}
function go(n){ S.screen=n; stopSpeech(); render(); window.scrollTo({top:0}); card.focus&&card.focus(); }

function renderSignin(){
  card.innerHTML=`
  <div class="hero">
    <div>
      <h1>One bite, nine meters</h1>
      <p>You are going to follow one bite of pepperoni pizza through your digestive system, from the first chew to the very end. At each stop, find out what that organ does to the bite.</p>
      <p class="small">At the end you get a trip code to show your teacher. Mistakes are okay. Your first try on each question counts, and you can keep trying until you get it.</p>
    </div>
    <svg viewBox="0 0 200 180" aria-hidden="true"><path d="M20 160 L100 20 L180 160 Z" fill="#FFF1CC" stroke="#1B2330" stroke-width="3" stroke-linejoin="round"/><path d="M14 162 Q100 186 186 162" fill="none" stroke="#1B2330" stroke-width="10" stroke-linecap="round"/><circle cx="90" cy="100" r="12" fill="#F3E6EE" stroke="#7A2E5A" stroke-width="3"/><circle cx="120" cy="130" r="12" fill="#F3E6EE" stroke="#7A2E5A" stroke-width="3"/><circle cx="70" cy="140" r="10" fill="#F3E6EE" stroke="#7A2E5A" stroke-width="3"/><path d="M100 20 l8 -12 l8 14 z" fill="#E3A21A"/></svg>
  </div>
  <div class="nav"><span></span><button class="go" id="startBtn">Start the trip</button></div>`;
  startBtn.onclick=()=>{S.start=Date.now();go(1);};
}

function renderBrief(){
  const tube=['Mouth','Esophagus','Stomach','Small intestine','Large intestine'];
  if(!S.predOrder) S.predOrder=shuffle(tube,'order');
  const all=['Mouth','Esophagus','Stomach','Liver','Gallbladder','Pancreas','Small intestine','Large intestine'];
  if(!S.predTravel) S.predTravel={};
  card.innerHTML=`
  <span class="stopTag tag-main">Before you go</span>
  <h2>Make your predictions</h2>
  <p>The digestive system is one long tube, about 9 meters (30 feet) from start to end, plus helper organs attached to it. Make your best guess. You will not lose points for predictions.</p>
  <h3>1. Put the stops on the tube in order, first to last.</h3>
  <ol class="orderList" id="ol"></ol>
  <h3 style="margin-top:18px">2. Check every organ you think the bite will actually travel through.</h3>
  <div class="checks">${all.map(o=>`<label><input type="checkbox" value="${o}" ${S.predTravel[o]?'checked':''}> ${o}</label>`).join('')}</div>
  <div class="nav"><button class="back" id="bk">Back</button><button class="go" id="nx">Lock in predictions and swallow</button></div>`;
  const drawOL=()=>{
    ol.innerHTML=S.predOrder.map((o,i)=>`<li><b>${i+1}</b><span>${o}</span><button aria-label="Move ${o} up" data-u="${i}" ${i===0?'disabled':''}>▲</button><button aria-label="Move ${o} down" data-d="${i}" ${i===tube.length-1?'disabled':''}>▼</button></li>`).join('');
    ol.querySelectorAll('button').forEach(b=>b.onclick=()=>{
      const i=+(b.dataset.u??b.dataset.d), j=b.dataset.u!==undefined?i-1:i+1;
      [S.predOrder[i],S.predOrder[j]]=[S.predOrder[j],S.predOrder[i]]; drawOL();
      ol.querySelector(`button[${b.dataset.u!==undefined?'data-u':'data-d'}="${j}"]`)?.focus();
    });
  };
  drawOL();
  card.querySelectorAll('.checks input').forEach(c=>c.onchange=()=>{S.predTravel[c.value]=c.checked;});
  bk.onclick=()=>go(0);
  nx.onclick=()=>{
    const orderOK = S.predOrder.join()===tube.join();
    const travelOK = all.every(o=>!!S.predTravel[o]===tube.includes(o));
    S.pred={orderOK,travelOK,helpersKnown:HELPERS.filter(h=>!S.predTravel[h[0].toUpperCase()+h.slice(1)]).length};
    go(2);
  };
}

function renderStop(i){
  const st=STOPS[i], prev=i>0?STOPS[i-1].bite:{S:'whole',P:'whole',F:'whole'};
  const items=[];
  if(st.line==='helper') items.push([`${st.id}_travel`,travelItem(st),true]);
  else if(!st.noKind) items.push([`${st.id}_kind`,kindItem(st),true]);
  st.qs.forEach((q,k)=>items.push([`${st.id}_q${k}`,q,false]));
  card.innerHTML=`
  <span class="stopTag ${st.line==='helper'?'tag-helper':'tag-main'}">Stop ${i+1} of ${STOPS.length} · ${st.line==='helper'?'Helper organ (feeder line)':'Main line'}</span>
  <h2>${st.name}</h2>
  <div class="twocol">
    <div class="read" id="readText">${st.text.map(t=>`<p>${t}</p>`).join('')}</div>
    <figure class="organ" style="margin:0">${ICON[st.icon]}<figcaption>${st.name}</figcaption></figure>
  </div>
  <div class="tools">
    <button class="chip" id="spk" aria-pressed="false">Read it to me</button>
    <button class="chip" id="wbtn" aria-pressed="false">Key words</button>
    <button class="chip" id="dbtn" aria-pressed="false">Deeper dive</button>
  </div>
  <dl class="words" id="wbox">${st.words.map(([w,d])=>`<div><dt>${w}:</dt> <dd>${d}</dd></div>`).join('')}</dl>
  <div class="deep" id="dbox">${st.deep}</div>
  ${tracker(st,prev)}
  ${items.map(([k,it,p])=>mcqHTML(k,it,p)).join('')}
  ${logHTML(i)}
  <div class="nav"><button class="back" id="bk">Back</button><span class="lock" id="lk">Answer the questions to move on.</span><button class="go" id="nx" disabled>${i===STOPS.length-1?'Head for the exit':'Next stop'}</button></div>`;
  const check=()=>{const done=items.every(([k])=>S.solved[k+'_done']); nx.disabled=!done; lk.textContent=done?'':'Answer the questions to move on.';};
  items.forEach(([k,it])=>wireMCQ(card,k,it,'main',check));
  check();
  toggle(wbtn,wbox); toggle(dbtn,dbox);
  spk.onclick=()=>speak(readText.innerText, spk);
  bk.onclick=()=>go(S.screen-1);
  nx.onclick=()=>go(S.screen+1);
}
function toggle(btn,box){btn.onclick=()=>{const on=box.classList.toggle('on');btn.setAttribute('aria-pressed',on);};}
function logHTML(upto){
  const rows=STOPS.slice(0,upto+1);
  return `<details class="logWrap"><summary>Travel log (copy this onto your worksheet)</summary><div class="tableScroll"><table class="log"><tr><th>Stop</th><th>Type of digestion / Does food pass through?</th><th>What happens here</th><th>Macromolecules</th></tr>${rows.map(r=>`<tr><td>${r.name}</td><td>${r.line==='helper'?'No. Helper organ':(r.id==='absorb'?'Chemical (then absorption)':r.kind)}</td><td>${r.log}</td><td>${r.macro}</td></tr>`).join('')}</table></div></details>`;
}

function renderCase(){
  card.innerHTML=`
  <span class="stopTag tag-main">Exit exam</span>
  <h2>The pepperoni problem</h2>
  <p>You made it to the end of the line. Now use what you learned on the trip to solve a real case.</p>
  <div class="case">
    <b>Patient J.T., age 45</b>
    <ul>
      <li>Gets sharp pain in the upper right belly about an hour after eating pizza or fries.</li>
      <li>Stool is pale and greasy after fatty meals.</li>
      <li>Toast and grilled chicken cause no problems.</li>
      <li>Ultrasound: stones inside the gallbladder, one blocking the bile duct.</li>
      <li>Liver blood tests: normal. Pancreatic enzyme test: normal.</li>
      <li>Also: chews food slowly, drinks a lot of water, esophagus looks normal.</li>
    </ul>
  </div>
  ${mcqHTML('case_claim',{q:'Claim: '+CASE.claimQ,o:CASE.claims,hint:'Which organ stores and releases bile? Which test results are normal?'},true)}
  <div class="q" id="clueQ">
    <div class="prompt">Evidence: choose the 3 clues that best support your claim.</div>
    <div class="checks" id="clues">${CASE.clues.map((c,i)=>`<label><input type="checkbox" value="${i}"> ${c[0]}</label>`).join('')}</div>
    <button class="chip" id="clueChk" style="margin-top:10px">Check my evidence</button>
    <div class="fb" id="clueFb" role="status"></div>
  </div>
  <div class="q">
    <div class="prompt"><label for="rsn">Reasoning: explain how your evidence supports your claim.</label></div>
    <div class="frame">Sentence starters: "The ______ normally ______. The clue that ______ shows ______. This explains why only ______ foods cause problems. The ______ is not the problem because ______."</div>
    <textarea id="rsn" placeholder="Type at least two sentences.">${esc(S.reasoning)}</textarea>
  </div>
  <div class="nav"><button class="back" id="bk">Back</button><span class="lock" id="lk"></span><button class="go" id="nx" disabled>Finish the case</button></div>`;
  let claimDone=!!S.solved['case_claim_done'], clueDone=S.cluesRight!==null && S.solved['clues_done'];
  const check=()=>{
    const r=rsn.value.trim(); S.reasoning=r;
    const ok = S.solved['case_claim_done'] && S.solved['clues_done'] && r.split(/\s+/).length>=12;
    nx.disabled=!ok;
    lk.textContent= ok?'':'Finish the claim, evidence, and at least 12 words of reasoning.';
  };
  wireMCQ(card,'case_claim',{o:CASE.claims},'main',()=>{S.claimRight=S.first['case_claim'];check();});
  if(S.solved['clues_done']){ card.querySelectorAll('#clues input').forEach(c=>{c.checked=!!CASE.clues[c.value][1];c.disabled=true;}); clueFb.className='fb good'; clueFb.textContent='Solved.'; clueChk.remove(); }
  else clueChk.onclick=()=>{
    const picked=[...card.querySelectorAll('#clues input:checked')].map(c=>+c.value);
    if(picked.length!==3){clueFb.className='fb bad';clueFb.textContent='Pick exactly 3 clues.';return;}
    const right=picked.filter(i=>CASE.clues[i][1]).length;
    if(S.cluesRight===null) S.cluesRight = right===3;
    if(right===3){clueFb.className='fb good';clueFb.textContent='Strong evidence. The blocked duct explains the symptoms, the fat-only pattern points to bile, and normal liver tests rule out the liver.';S.solved['clues_done']=true;card.querySelectorAll('#clues input').forEach(c=>c.disabled=true);clueChk.remove();}
    else {clueFb.className='fb bad';clueFb.textContent=`${right} of 3 are strong. Which clues are about bile, fat, or ruling out other organs? Swap out any clue that would be true for a healthy person.`;}
    check();
  };
  rsn.addEventListener('input',check); check();
  bk.onclick=()=>go(S.screen-1);
  nx.onclick=()=>go(S.screen+1);
}

function renderGF(){
  card.innerHTML=`
  <span class="stopTag tag-helper">Going further (optional)</span>
  <h2>Bonus challenge</h2>
  <p>These are extra. They are scored separately and will not lower your main score.</p>
  ${GF.map((g,i)=>mcqHTML('gf'+i,g,false)).join('')}
  <div class="nav"><button class="back" id="bk">Back</button><button class="go" id="nx">See my results</button></div>`;
  GF.forEach((g,i)=>wireMCQ(card,'gf'+i,g,'gf'));
  bk.onclick=()=>go(S.screen-1);
  nx.onclick=()=>go(S.screen+1);
}

function results(){
  const keys=Object.keys(S.first);
  let right=keys.filter(k=>S.first[k]).length, total=keys.length;
  total+=1; if(S.cluesRight) right+=1;
  const pct=Math.round(100*right/total);
  const gfKeys=Object.keys(S.gf).filter(k=>!k.endsWith('_done'));
  const gfRight=gfKeys.filter(k=>S.gf[k]).length;
  const letters='ABCDEFGHJKMNPQRSTUVWXYZ';
  const chk=letters[(right*7+total*3)%letters.length];
  const code=`BITE-${String(right).padStart(2,'0')}${chk}`;
  const minutes=Math.max(1,Math.round((Date.now()-S.start)/60000));
  const p=S.pred||{};
  const pred=`order ${p.orderOK?'yes':'no'}, route ${p.travelOK?'yes':'no'}`;
  return {right,total,pct,code,minutes,pred,gf:gfKeys.length?`${gfRight}/${GF.length}`:'skipped'};
}

function renderDone(){
  const r=results(), p=S.pred||{};
  card.innerHTML=`
  <span class="stopTag tag-main">Trip complete</span>
  <h2>Nice work!</h2>
  <p>The bite took about 1 to 3 days to make this trip. You did it in ${r.minutes} minute${r.minutes===1?"":"s"}.</p>
  <div class="code" aria-label="Your trip code">${r.code}</div>
  <p class="score">First-try score: <b>${r.right} / ${r.total}</b> (${r.pct}%)</p>
  <p class="small">Going further: ${r.gf}</p>
  <div class="save" id="saveMsg">Show your teacher this screen, or write your trip code at the top of your worksheet. Your score is not sent anywhere.</div>
  <h3>Your predictions vs. what happened</h3>
  <ul class="compare">
    <li>Order of the tube: ${p.orderOK?'you had it right':'the real order is mouth, esophagus, stomach, small intestine, large intestine'}.</li>
    <li>Organs the food travels through: ${p.travelOK?'you had it right':'food never passes through the liver, gallbladder, or pancreas. They only send juices.'}</li>
  </ul>
  <p>Write your trip code at the top of your worksheet, and finish your travel log below if you have not already.</p>
  ${logHTML(STOPS.length-1).replace('<details class="logWrap">','<details class="logWrap" open>')}
  <div class="nav"><button class="back" id="bk">Back</button><button class="go" id="copyBtn">Copy my results</button></div>`;
  bk.onclick=()=>go(S.screen-1);
  copyBtn.onclick=()=>copyResults(r);
}
function copyResults(r){
  const txt=`Trip code: ${r.code}\nFirst-try score: ${r.right}/${r.total} (${r.pct}%)\nGoing further: ${r.gf}\nPredictions: ${r.pred}\nTime: ${r.minutes} min\n\nCase reasoning:\n${S.reasoning}`;
  const msg=document.getElementById('saveMsg');
  const ok=()=>{msg.textContent='✓ Copied. Paste it into your assignment or send it to your teacher.';};
  const fail=()=>{
    const ta=document.createElement('textarea'); ta.value=txt; ta.style.cssText='position:fixed;opacity:0';
    document.body.appendChild(ta); ta.select();
    try{document.execCommand('copy');ok();}catch(e){msg.textContent='Could not copy. Show your teacher this screen instead.';}
    ta.remove();
  };
  if(navigator.clipboard&&navigator.clipboard.writeText) navigator.clipboard.writeText(txt).then(ok,fail); else fail();
}

/* ---------- utils ---------- */
function esc(s){return String(s||'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));}
function speak(text,btn){
  if(!('speechSynthesis' in window)){btn.textContent='Read-aloud is not available';return;}
  if(speechSynthesis.speaking){stopSpeech();btn.setAttribute('aria-pressed','false');btn.textContent='Read it to me';return;}
  const u=new SpeechSynthesisUtterance(text); u.rate=0.9;
  u.onend=()=>{btn.setAttribute('aria-pressed','false');btn.textContent='Read it to me';};
  btn.setAttribute('aria-pressed','true');btn.textContent='Stop reading';
  speechSynthesis.speak(u);
}
function stopSpeech(){ if('speechSynthesis' in window) speechSynthesis.cancel(); }
render();
</script>
</body>
</html>
